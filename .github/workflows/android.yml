name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The first run mints the signing key and commits it; every later run
      # reuses it, so each APK installs over the one before it.
      - name: Ensure a stable signing key
        run: |
          if [ -f android/debug.keystore.b64 ]; then
            base64 -d android/debug.keystore.b64 > android/debug.keystore
          else
            keytool -genkeypair -v -keystore android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 20000 \
              -dname "CN=The Ritual, O=The Ritual, C=US"
            base64 -w 76 android/debug.keystore > android/debug.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/debug.keystore.b64
            git commit -m "Add the app's signing key [skip ci]"
            git push
          fi

      - name: Sync the page into the app's assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: the-ritual-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
