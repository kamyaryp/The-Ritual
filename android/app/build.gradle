plugins { id 'com.android.application' }

android {
    namespace 'com.ritual.dial'
    compileSdk 34

    defaultConfig {
        applicationId "com.ritual.dial"
        minSdk 24
        targetSdk 34
        // CI passes the run number (every build installs over the last) and an id of the
        // native code, which "Check for update" compares with the latest release's.
        versionCode Integer.parseInt((project.findProperty('appCode') ?: '3').toString())
        versionName "1.3." + (project.findProperty('appCode') ?: '0')
        buildConfigField "String", "NATIVE_ID", "\"" + (project.findProperty('nativeId') ?: 'dev') + "\""
    }

    // One fixed key, kept in the repo, so every build installs over the last
    // one instead of being refused as a different app.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google sign-in for Drive sync (the drive.appdata scope only)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
