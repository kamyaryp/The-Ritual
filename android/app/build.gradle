plugins { id 'com.android.application' }

android {
    namespace 'com.ritual.dial'
    compileSdk 34

    defaultConfig {
        applicationId "com.ritual.dial"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // unsigned; the debug APK from CI is the one to sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
