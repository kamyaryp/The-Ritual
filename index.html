/* Dark only, warm near-black. Dial above, four gods in a 2x2 below, chronicle last. */
:root{
  --bg:#0d0d0c; --panel:#151413; --panel-2:#1a1917; --line:#272523; --line-2:#1f1e1c;
  --ink:#edebe5; --ink-2:#9d9890; --ink-3:#6b6760;
  --well:#121110; --lapsed:#232220;
  --xeron:#e0514e;   --xeron-dim:#3a1d1c;
  --arurael:#5a8de6; --arurael-dim:#1b2940;
  --xenlil:#dfa838;  --xenlil-dim:#382b11;
  --arexia:#3cb886;  --arexia-dim:#113128;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rune:"Noto Sans Runic","Segoe UI Symbol","Segoe UI Historic",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body,svg{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.5; letter-spacing:-.005em;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:30px 44px;
}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:500;font-size:clamp(20px,3vw,25px);margin:0;letter-spacing:-.02em}
.stamp{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.stage{display:grid;grid-template-columns:minmax(290px,1fr) minmax(320px,1.05fr);gap:30px;align-items:center}
@media (max-width:880px){.stage{grid-template-columns:1fr}}
.dialbox{display:flex;justify-content:center}
svg.dial{width:100%;max-width:400px;height:auto}

.band{transition:fill .25s ease,stroke-opacity .25s ease}
.band.open,.band.sealed{cursor:pointer}
.band.lapsed{cursor:not-allowed}
.band.open:hover,.band.sealed:hover{fill-opacity:.85}
.band:focus,.band:focus-visible{outline:none}
@media (prefers-reduced-motion:no-preference){
  .band.open{animation:breathe 2.8s ease-in-out infinite}
  .needle{transition:transform .6s cubic-bezier(.33,1,.68,1)}
}
@keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.28}}
.tick{stroke:var(--ink-3)}
.numeral{font-size:14px;fill:var(--ink-3)}
.flame{pointer-events:none}
.count{font-family:var(--mono);font-weight:500;font-size:30px;fill:var(--ink);font-variant-numeric:tabular-nums}
.godname{font-size:13px;font-weight:500;letter-spacing:.04em}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.card[data-active="1"]{border-color:var(--hue);background:var(--panel-2)}
.card-head{display:flex;align-items:baseline;gap:8px}
.gname{font-size:15px;font-weight:600;color:var(--hue);letter-spacing:-.01em}
.ghours{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

.rite{display:flex;align-items:center;gap:10px;min-width:0}
.box{flex:0 0 auto;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s,box-shadow .15s}
.box:hover:not(:disabled){border-color:var(--hue)}
.box svg{width:11px;height:11px;opacity:0;transition:opacity .15s}
.box[aria-checked="true"]{background:var(--hue);border-color:var(--hue)}
.box[aria-checked="true"] svg{opacity:1}
.box svg path{stroke:var(--bg)}
.box:disabled{cursor:not-allowed;border-style:dashed;opacity:.5}
.rite[data-state="open"] .box:not([aria-checked="true"]){border-color:var(--hue)}
.rite[data-done="1"] .rnum{text-decoration:line-through}
.rite[data-state="lapsed"]:not([data-done="1"]) .rnum,.rite[data-state="lapsed"]:not([data-done="1"]) .win{opacity:.5}
.rite{cursor:pointer;border-radius:4px;padding:1px 2px;margin:0 -2px}
.rite:hover{background:var(--panel-2)}
.rite[data-state="lapsed"]{cursor:not-allowed}
.rite[data-state="lapsed"]:hover{background:transparent}
.rnum{flex:0 0 auto;width:18px;text-align:center;font-family:var(--rune);font-size:16px;line-height:1;color:var(--ink-2)}
.rite[data-state="open"] .rnum,.rite[data-done="1"] .rnum{color:var(--hue)}
.win{flex:0 0 auto;margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.chron{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
h2{font-weight:500;font-size:14px;margin:0;color:var(--ink-2);letter-spacing:-.01em}
.stats{display:flex;gap:20px;font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 12px 8px;overflow-x:auto}
svg.chart{display:block;width:100%;min-width:420px;height:auto;aspect-ratio:700/190}
@media (max-width:620px){
  body{padding-block:22px 36px}
  .wrap{gap:22px}
  .stage{gap:22px}
  svg.dial{max-width:330px}
  .chartbox{padding:12px 10px 6px;overflow-x:visible}
  svg.chart{min-width:0;aspect-ratio:420/190}
  .stats{gap:14px;font-size:11.5px}
  footer{justify-content:stretch}
  footer button.act{flex:1 1 auto;padding:9px 10px}
  .rite{padding:4px 2px}
  .box{width:20px;height:20px}
  .sheet{max-width:none}
}
.gridline{stroke:var(--line-2)}
.axlabel,.daylabel{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.daylabel.today{fill:var(--ink-2)}
.emptybar{fill:var(--line-2)}
.empty{padding:34px 10px;text-align:center;color:var(--ink-3);font-size:13px}

footer{display:flex;gap:8px;justify-content:flex-end}
button.act{font:inherit;font-size:12px;color:var(--ink-3);background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button.act:hover{border-color:var(--ink-3);color:var(--ink)}
button.act.danger:hover{border-color:var(--xeron);color:var(--xeron)}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.66);padding:16px}
.sheet{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:300px;width:100%}
.sheet p{margin:0;font-size:14px}
.sheet .msub{margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-size:12.5px;padding:8px 14px;border-radius:5px;z-index:20}
</style>
</head>
<body>


<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <p id="mTitle">Erase every record?</p>
    <p class="msub" id="mSub">This day and the whole chronicle. It cannot be undone.</p>
    <div class="mrow">
      <button class="act" id="mNo" type="button">Keep</button>
      <button class="act danger" id="mYes" type="button">Erase</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>The Ritual</h1>
    <span class="stamp" id="stamp">—</span>
  </header>

  <div class="stage">
    <div class="dialbox">
      <svg class="dial" viewBox="0 0 380 380" role="img" aria-label="The dial of the four gods">
        <circle cx="190" cy="190" r="151" fill="var(--well)"></circle>
        <g id="bands"></g>
        <g id="ticks"></g>
        <circle cx="190" cy="190" r="88" fill="var(--bg)" stroke="var(--line)"></circle>
        <g class="needle" id="needle">
          <line id="hand" x1="190" y1="128" x2="190" y2="103" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round"></line>
        </g>
        <g class="flame" id="flame" opacity="0">
          <path id="fl0"></path><path id="fl1"></path><path id="fl2"></path>
          <g id="embers"></g>
          <path id="fl3"></path><path id="fl4"></path>
        </g>
        <text class="count" id="count" x="190" y="200" text-anchor="middle">0/8</text>
      </svg>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <section class="chron">
    <div class="sec-head">
      <h2>Chronicle</h2>
      <div class="stats">
        <span><b id="statToday">0/8</b> today</span>
        <span><b id="statStreak">0</b> streak</span>
        <span><b id="statAvg">0.0</b> avg</span>
      </div>
    </div>
    <div class="chartbox">
      <svg class="chart" id="chart" viewBox="0 0 700 190" aria-label="Rites fulfilled, last fourteen days"></svg>
      <div class="empty" id="chartEmpty" hidden>Nothing inscribed yet. This day is entered at midnight.</div>
    </div>
    <footer>
      <button class="act" id="btnClearToday" type="button">Clear day</button>
      <button class="act danger" id="btnClearAll" type="button">Clear data</button>
    </footer>
  </section>
</div>

<script>
(function(){
  "use strict";
  var KEY="dial.gods.v1";
  /* Hours of grace after a rite's window closes. 0 = the past is past. */
  var GRACE=0;
  var GODS=[
    {key:"arexia", name:"Arexia",  face:"12–3", a0:0,   a1:90,  hue:"var(--arexia)",  dim:"var(--arexia-dim)"},
    {key:"xeron",  name:"Xeron",   face:"3–6",  a0:90,  a1:180, hue:"var(--xeron)",   dim:"var(--xeron-dim)"},
    {key:"arurael",name:"Arurael", face:"6–9",  a0:180, a1:270, hue:"var(--arurael)", dim:"var(--arurael-dim)"},
    {key:"xenlil", name:"Xenlil",  face:"9–12", a0:270, a1:360, hue:"var(--xenlil)",  dim:"var(--xenlil-dim)"}
  ];
  var CX=190, CY=190, GAP=2.2, RINGS=[[94,116],[120,148]], svgNS="http://www.w3.org/2000/svg";
  /* the eight rites of the day, in order from midnight */
  var RUNE=["\u16A0","\u16A2","\u16A6","\u16A8","\u16B1","\u16B2","\u16B7","\u16B9"];
  function riteNo(god,i){ return GODS.indexOf(god)+1+i*4; }

  /* rite 0 runs before noon, rite 1 the same hours after it */
  function windowOf(g,i){ return [g.a0/30+(i?12:0), g.a1/30+(i?12:0)]; }
  function fmt(h){ return String(Math.floor(h)%24).padStart(2,"0")+":00"; }
  function nowHours(){ var d=new Date(); return d.getHours()+d.getMinutes()/60; }
  function riteState(g,i){
    var w=windowOf(g,i), h=nowHours();
    if(h<w[0]) return "awaiting";
    if(h<w[1]+GRACE) return "open";
    return "lapsed";
  }

  function dayKey(d){
    d=d||new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function blankChecks(){ var c={}; GODS.forEach(function(g){c[g.key]=[false,false];}); return c; }
  function fresh(){
    return {day:{date:dayKey(), checks:blankChecks()}, history:[]};
  }
  var state;
  function load(){
    try{
      var raw=localStorage.getItem(KEY); if(!raw) return fresh();
      var s=JSON.parse(raw); if(!s||!s.day) return fresh();
      delete s.missions;
      s.day.checks=s.day.checks||{};
      GODS.forEach(function(g){
        if(!s.day.checks[g.key]) s.day.checks[g.key]=[false,false];
      });
      if(!Array.isArray(s.history)) s.history=[];
      if(s.sample){ s.history=[]; delete s.sample; }
      return s;
    }catch(e){ return fresh(); }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function total(c){ var n=0; GODS.forEach(function(g){ (c[g.key]||[]).forEach(function(v){ if(v) n++; }); }); return n; }
  function rollover(){
    var today=dayKey();
    if(state.day.date===today) return false;
    state.history.push({date:state.day.date, checks:state.day.checks});
    state.history=state.history.slice(-400);
    state.day={date:today, checks:blankChecks()};
    save(); return true;
  }

  function pt(r,a){ var t=(a-90)*Math.PI/180; return [CX+r*Math.cos(t), CY+r*Math.sin(t)]; }
  function segPath(r1,r2,a0,a1){
    var p1=pt(r2,a0),p2=pt(r2,a1),p3=pt(r1,a1),p4=pt(r1,a0),big=(a1-a0)>180?1:0;
    return "M"+p1[0].toFixed(2)+" "+p1[1].toFixed(2)+
           "A"+r2+" "+r2+" 0 "+big+" 1 "+p2[0].toFixed(2)+" "+p2[1].toFixed(2)+
           "L"+p3[0].toFixed(2)+" "+p3[1].toFixed(2)+
           "A"+r1+" "+r1+" 0 "+big+" 0 "+p4[0].toFixed(2)+" "+p4[1].toFixed(2)+"Z";
  }
  function el(n,a){ var e=document.createElementNS(svgNS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }

  var bandNodes={};
  function buildDial(){
    var g=document.getElementById("bands");
    GODS.forEach(function(god){
      var a0=god.a0+GAP, a1=god.a1-GAP;
      bandNodes[god.key]=[];
      [0,1].forEach(function(i){
        var p=el("path",{d:segPath(RINGS[i][0],RINGS[i][1],a0,a1),class:"band",fill:god.dim,
          stroke:god.hue,"stroke-width":"2","stroke-opacity":"0"});
        p.addEventListener("click",function(){ attempt(god,i); });
        g.appendChild(p);
        bandNodes[god.key][i]=p;
      });
      var lp=pt(176,(god.a0+god.a1)/2);
      var t=el("text",{x:lp[0].toFixed(1),y:lp[1].toFixed(1),class:"godname",fill:god.hue,
        "text-anchor":"middle","dominant-baseline":"middle"});
      t.textContent=god.name;
      g.appendChild(t);
    });
    var ticks=document.getElementById("ticks");
    for(var h=0;h<12;h++){
      var a=h*30,p1=pt((h%3===0)?138:144,a),p2=pt(149,a);
      ticks.appendChild(el("line",{x1:p1[0].toFixed(1),y1:p1[1].toFixed(1),x2:p2[0].toFixed(1),y2:p2[1].toFixed(1),
        class:"tick","stroke-width":(h%3===0?1.3:0.8)}));
    }
    [[12,0],[3,90],[6,180],[9,270]].forEach(function(n){
      var p=pt(128,n[1]);
      var t=el("text",{x:p[0].toFixed(1),y:p[1].toFixed(1),class:"numeral","text-anchor":"middle","dominant-baseline":"middle"});
      t.textContent=n[0]; ticks.appendChild(t);
    });
  }

  function buildCards(){
    var host=document.getElementById("cards");
    GODS.forEach(function(god){
      var card=document.createElement("div");
      card.className="card"; card.style.setProperty("--hue",god.hue); card.dataset.god=god.key;
      var head=document.createElement("div"); head.className="card-head";
      head.innerHTML='<span class="gname">'+god.name+'</span><span class="ghours">'+god.face+'</span>';
      card.appendChild(head);
      [0,1].forEach(function(i){
        var w=windowOf(god,i);
        var row=document.createElement("div"); row.className="rite"; row.dataset.idx=i;
        var b=document.createElement("button");
        b.type="button"; b.className="box"; b.setAttribute("role","checkbox"); b.setAttribute("aria-checked","false");
        b.setAttribute("aria-label","Rite "+riteNo(god,i)+" of "+god.name+", "+fmt(w[0])+" to "+fmt(w[1]));
        b.innerHTML='<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.4 L5.6 10.4 L11.5 3.8" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var no=riteNo(god,i);
        var num=document.createElement("span"); num.className="rnum"; num.textContent=RUNE[no-1];
        var win=document.createElement("span"); win.className="win";
        win.textContent=String(w[0]).padStart(2,"0")+"–"+String(w[1]%24).padStart(2,"0");
        row.addEventListener("click",function(){ attempt(god,i); });
        b.addEventListener("click",function(ev){ ev.stopPropagation(); attempt(god,i); });
        row.appendChild(b); row.appendChild(num); row.appendChild(win);
        card.appendChild(row);
      });
      host.appendChild(card);
    });
  }

  function attempt(god,i){
    if(riteState(god,i)==="lapsed"){ toast("The hour has passed."); return; }
    state.day.checks[god.key][i]=!state.day.checks[god.key][i];
    save(); render();
  }

  function render(){
    var done=total(state.day.checks);
    document.getElementById("count").textContent=done+"/8";
    document.getElementById("statToday").textContent=done+"/8";
    var openIdx=null, openGod=null;

    GODS.forEach(function(god){
      var card=document.querySelector('.card[data-god="'+god.key+'"]'), active=false;
      [0,1].forEach(function(i){
        var st=riteState(god,i), on=!!state.day.checks[god.key][i], band=bandNodes[god.key][i];
        if(st==="open"){ active=true; openIdx=i; }
        band.setAttribute("class","band "+(on?"sealed ":"")+st);
        band.setAttribute("fill", on?god.hue:(st==="lapsed"?"var(--lapsed)":god.dim));
        band.setAttribute("stroke-opacity", st==="open"?"1":"0");
        var ti=band.querySelector("title")||band.appendChild(el("title",{}));
        ti.textContent=RUNE[riteNo(god,i)-1]+" · "+god.name+" · "+
          fmt(windowOf(god,i)[0])+"–"+fmt(windowOf(god,i)[1])+" · "+(on?"sealed":st);
        var row=card.querySelector('.rite[data-idx="'+i+'"]');
        row.dataset.done=on?"1":"0"; row.dataset.state=st;
        var box=row.querySelector(".box");
        box.setAttribute("aria-checked", on?"true":"false");
        box.disabled=(st==="lapsed");
      });
      card.dataset.active=active?"1":"0";
      if(active) openGod=god;
    });
    placeFlame(openGod,openIdx);
    drawChart();
    renderClock();
  }

  /* ---------- fire ----------
     Five nested tongues redrawn every frame. Height, lean and width come from
     several sines at unrelated rates plus a wind that re-aims at random
     intervals, so the shape never repeats. Embers are their own particles. */
  var LAYERS=[
    {id:"fl0", hs:1.00, ws:1.00, op:.22, white:false, ph:0.0},
    {id:"fl1", hs:0.84, ws:0.76, op:.55, white:false, ph:1.7},
    {id:"fl2", hs:0.66, ws:0.56, op:.95, white:false, ph:3.1},
    {id:"fl3", hs:0.46, ws:0.38, op:.38, white:true,  ph:4.6},
    {id:"fl4", hs:0.29, ws:0.24, op:.85, white:true,  ph:5.9}
  ];
  var FIRE={on:false, t:0, last:0, wind:0, windTo:0, gust:0, parts:[], nodes:[], raf:0};

  function tongue(h,w,lean,t,ph){
    var bx=w/2, wob=function(f,k){ return Math.sin(t*f+ph*k); };
    var c1x=-bx-w*0.34+wob(3.1,1.0)*w*0.13, c1y=-h*0.32;
    var c2x=-w*0.19+lean*0.55+wob(4.7,1.7)*w*0.20, c2y=-h*0.73;
    var c3x= w*0.19+lean*0.55+wob(4.3,2.1)*w*0.20, c3y=-h*0.73;
    var c4x= bx+w*0.34+wob(3.6,1.3)*w*0.13, c4y=-h*0.32;
    var tx=lean+wob(6.7,0.7)*w*0.10;
    return "M"+(-bx).toFixed(2)+" 0C"+c1x.toFixed(2)+" "+c1y.toFixed(2)+","+c2x.toFixed(2)+" "+c2y.toFixed(2)+
           ","+tx.toFixed(2)+" "+(-h).toFixed(2)+"C"+c3x.toFixed(2)+" "+c3y.toFixed(2)+","+c4x.toFixed(2)+" "+
           c4y.toFixed(2)+","+bx.toFixed(2)+" 0Z";
  }
  function frame(ts){
    FIRE.raf=0;
    if(!FIRE.on) return;
    var dt=FIRE.last?Math.min(.05,(ts-FIRE.last)/1000):.016;
    FIRE.last=ts; FIRE.t+=dt;
    var t=FIRE.t;
    if(t>FIRE.gust){ FIRE.windTo=(Math.random()*2-1)*4.6; FIRE.gust=t+.22+Math.random()*.95; }
    FIRE.wind+=(FIRE.windTo-FIRE.wind)*Math.min(1,dt*5);
    var puff=.80+.13*Math.sin(t*5.3)+.07*Math.sin(t*9.7+1.3)+.05*Math.sin(t*16.1+2.6)+(Math.random()-.5)*.05;
    var H=33*puff, W=15.5*(1.08-.14*puff);
    LAYERS.forEach(function(L,k){
      FIRE.nodes[k].setAttribute("d", tongue(H*L.hs, W*L.ws, FIRE.wind*(0.5+L.hs*0.8), t, L.ph));
    });

    if(Math.random()<dt*14){
      FIRE.parts.push({x:(Math.random()*2-1)*3, y:-H*(.45+Math.random()*.35),
        vx:FIRE.wind*.5+(Math.random()*2-1)*4, vy:-(14+Math.random()*22),
        life:.5+Math.random()*1.1, age:0, r:.5+Math.random()*1.2});
    }
    var box=document.getElementById("embers"), html="";
    for(var i=FIRE.parts.length-1;i>=0;i--){
      var pp=FIRE.parts[i]; pp.age+=dt;
      if(pp.age>=pp.life){ FIRE.parts.splice(i,1); continue; }
      pp.vy-=12*dt; pp.vx+=(FIRE.wind-pp.vx)*dt*1.5;
      pp.x+=pp.vx*dt; pp.y+=pp.vy*dt;
      var f=1-pp.age/pp.life;
      html+='<circle cx="'+pp.x.toFixed(2)+'" cy="'+pp.y.toFixed(2)+'" r="'+(pp.r*f).toFixed(2)+
            '" fill="'+FIRE.hue+'" opacity="'+(f*.85).toFixed(2)+'"/>';
    }
    box.innerHTML=html;
    FIRE.raf=requestAnimationFrame(frame);
  }
  function kindle(){
    if(FIRE.on||document.hidden) return;
    FIRE.on=true; FIRE.last=0;
    FIRE.raf=requestAnimationFrame(frame);
  }
  function douse(){ FIRE.on=false; if(FIRE.raf) cancelAnimationFrame(FIRE.raf); FIRE.raf=0; }

  function placeFlame(god,i){
    var f=document.getElementById("flame");
    if(!god || i===null){ f.setAttribute("opacity","0"); douse(); return; }
    if(!FIRE.nodes.length){
      FIRE.nodes=LAYERS.map(function(L){ return document.getElementById(L.id); });
      LAYERS.forEach(function(L,k){ FIRE.nodes[k].setAttribute("opacity",L.op); });
    }
    FIRE.hue=god.hue;
    LAYERS.forEach(function(L,k){ FIRE.nodes[k].setAttribute("fill", L.white?"#fff":god.hue); });
    var r=(RINGS[i][0]+RINGS[i][1])/2;
    var now=new Date(), a=((now.getHours()%12)+now.getMinutes()/60)*30, p=pt(r,a);
    f.setAttribute("opacity","1");
    f.setAttribute("transform","translate("+p[0].toFixed(2)+","+(p[1]+11).toFixed(2)+")");
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches){
      FIRE.on=true; FIRE.last=0; FIRE.t=1.7; frame(performance.now()); douse();
    } else kindle();
  }
  document.addEventListener("visibilitychange",function(){ if(document.hidden) douse(); else kindle(); });
  var rsz=null, wasWide=null;
  window.addEventListener("resize",function(){
    clearTimeout(rsz);
    rsz=setTimeout(function(){
      var wide=window.innerWidth>=620;
      if(wide!==wasWide){ wasWide=wide; drawChart(); }
    },180);
  });

  function renderClock(){
    var now=new Date(), a=((now.getHours()%12)+now.getMinutes()/60)*30;
    document.getElementById("needle").setAttribute("transform","rotate("+a.toFixed(2)+" "+CX+" "+CY+")");
    document.getElementById("stamp").textContent=
      now.toLocaleDateString(undefined,{day:"numeric",month:"short"})+"  "+
      now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false});
  }

  var SPAN=32;
  function lastDays(n){
    var out=[]; for(var i=n-1;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); out.push(dayKey(d)); } return out;
  }
  function recordFor(k){
    if(k===state.day.date) return state.day.checks;
    for(var i=state.history.length-1;i>=0;i--) if(state.history[i].date===k) return state.history[i].checks;
    return null;
  }
  function drawChart(){
    var svg=document.getElementById("chart");
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var days=lastDays(SPAN), today=dayKey();
    var any=days.some(function(d){ var r=recordFor(d); return r && total(r)>0; });
    document.getElementById("chartEmpty").hidden=any;
    svg.style.display=any?"block":"none";
    if(!any){ updateStats(); return; }

    var narrow=window.innerWidth<620;
    var W=(narrow?430:700),H=190,padL=24,padR=8,padT=12,padB=22;
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    var plotW=W-padL-padR, plotH=H-padT-padB, step=plotW/days.length;
    var bw=Math.max(3.5, Math.min(14, step*0.6)), every=narrow?8:4;
    for(var v=0; v<=8; v+=2){
      var y=padT+plotH-(v/8)*plotH;
      svg.appendChild(el("line",{x1:padL,y1:y.toFixed(1),x2:W-padR,y2:y.toFixed(1),class:"gridline"}));
      var t=el("text",{x:padL-7,y:(y+3.2).toFixed(1),class:"axlabel","text-anchor":"end"});
      t.textContent=v; svg.appendChild(t);
    }
    days.forEach(function(dk,i){
      var cx=padL+step*(i+0.5), x=cx-bw/2, rec=recordFor(dk);
      var last=i===days.length-1;
      if(last || (days.length-1-i)%every===0){
        var lab=el("text",{x:cx.toFixed(1),y:(H-6).toFixed(1),class:"daylabel"+(last?" today":""),"text-anchor":"middle"});
        lab.textContent=Number(dk.slice(8,10));
        svg.appendChild(lab);
      }
      if(!rec || total(rec)===0){ svg.appendChild(el("rect",{x:x.toFixed(1),y:(padT+plotH-2).toFixed(1),width:bw.toFixed(1),height:2,class:"emptybar"})); return; }
      var y=padT+plotH;
      GODS.forEach(function(g){
        var c=(rec[g.key]||[]).filter(Boolean).length; if(!c) return;
        var h=(c/8)*plotH; y-=h;
        var r=el("rect",{x:x.toFixed(1),y:y.toFixed(1),width:bw.toFixed(1),height:h.toFixed(1),fill:g.hue,rx:"1"});
        var ti=el("title",{}); ti.textContent=dk+" · "+g.name+" "+c+"/2"; r.appendChild(ti);
        svg.appendChild(r);
      });
    });
    updateStats();
  }
  function updateStats(){
    var sum=0,count=0;
    state.history.forEach(function(rec){ sum+=total(rec.checks); count++; });
    document.getElementById("statAvg").textContent=count?(sum/count).toFixed(1):"\u2014";
    var streak=0, d=new Date(), r0=recordFor(dayKey(d));
    if(!(r0 && total(r0)===8)) d.setDate(d.getDate()-1);
    for(var i=0;i<400;i++){
      var rr=recordFor(dayKey(d));
      if(rr && total(rr)===8){ streak++; d.setDate(d.getDate()-1); } else break;
    }
    document.getElementById("statStreak").textContent=streak;
  }

  var toastTimer=null;
  function toast(msg){
    var old=document.querySelector(".toast"); if(old) old.remove();
    var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.remove(); }, 2400);
  }

  state=load();
  rollover();
  buildDial(); buildCards(); render();

  var modal=document.getElementById("modal"), pending=null;
  function closeModal(){ modal.hidden=true; pending=null; }
  function ask(title,sub,label,fn){
    document.getElementById("mTitle").textContent=title;
    document.getElementById("mSub").textContent=sub;
    document.getElementById("mYes").textContent=label;
    pending=fn; modal.hidden=false;
  }
  document.getElementById("mNo").addEventListener("click",closeModal);
  modal.addEventListener("click",function(ev){ if(ev.target===modal) closeModal(); });
  document.addEventListener("keydown",function(ev){ if(ev.key==="Escape") closeModal(); });
  document.getElementById("mYes").addEventListener("click",function(){
    var fn=pending; closeModal(); if(fn) fn();
  });

  document.getElementById("btnClearToday").addEventListener("click",function(){
    ask("Unseal this day?","The eight rites of today return to unsealed. The chronicle is untouched.","Unseal",function(){
      state.day.checks=blankChecks(); save(); render(); toast("The day stands empty.");
    });
  });
  document.getElementById("btnClearAll").addEventListener("click",function(){
    ask("Erase every record?","This day and the whole chronicle. It cannot be undone.","Erase",function(){
      state={day:{date:dayKey(), checks:blankChecks()}, history:[]};
      try{ localStorage.removeItem(KEY); }catch(e){}
      render(); toast("All records erased.");
    });
  });

  setInterval(function(){ rollover(); render(); }, 20000);
})();
</script>

<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
